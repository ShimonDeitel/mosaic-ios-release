name: Mosaic
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Mosaic:
    type: application
    platform: iOS
    sources:
      - path: Mosaic
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.mosaic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Mosaic/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mosaic/Mosaic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  MosaicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MosaicTests
      - path: Mosaic.storekit
    dependencies:
      - target: Mosaic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.mosaic.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Mosaic:
    build:
      targets:
        Mosaic: all
        MosaicTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Mosaic.storekit
    test:
      config: Debug
      storeKitConfiguration: Mosaic.storekit
      targets:
        - MosaicTests
    archive:
      config: Release
